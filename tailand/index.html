<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f5a5c">
<title>Таиланд вдвоём</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Poiret+One&family=Manrope:wght@400;500;600;700;800&family=Caveat:wght@500;700&family=Mitr:wght@300;400&display=swap">
<style>
/* Layout: a living Andaman sea (WebGL, synced to Thai time) fills the page; cream botanical "postcards" float over it with a glass pill nav. Transparent "window" panels look through to the sea. */
:root{
  --paper:#f7efd9; --paper2:#efe3c4; --card:#fcf7ea; --card2:#f4ead0;
  --ink:#1d2a22; --ink2:#5d5a4b; --line:rgba(29,42,34,.62); --hair:rgba(29,42,34,.14);
  --jungle:#1f4a35; --leaf:#3f7a4f; --sage:#cddcb8; --lime:#d9e98c; --hib:#e04f7a; --blush:#f9cdd8; --mango:#f2a33a; --sea:#1d8a8c; --gold:#e8b75a;
  --glass:rgba(250,244,226,.72); --onimg:#fbf4e1;
  --sh1:0 1px 0 rgba(255,255,255,.6) inset,0 22px 50px -28px rgba(10,30,25,.65),0 6px 16px -10px rgba(10,30,25,.35);
  --f-disp:"Oranienbaum","Cormorant Garamond",Georgia,serif;
  --f-deco:"Poiret One","Futura","Century Gothic",sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --f-thai:"Mitr","Thonburi","Leelawadee UI",sans-serif;
  --bg:#2f5a5c;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#17201a; --paper2:#1f2a22; --card:#1d2820; --card2:#223026;
  --ink:#f1e8cf; --ink2:#b9b39c; --line:rgba(241,232,207,.45); --hair:rgba(241,232,207,.13);
  --jungle:#9cc7a4; --leaf:#86b58f; --sage:#2f4535; --lime:#c9da74; --hib:#f0749a; --blush:#5a2a3b; --mango:#f2ab4a; --sea:#4fb6b4; --gold:#efc46a;
  --glass:rgba(23,32,26,.72); --bg:#0d1a1c; color-scheme:dark;
  --sh1:0 1px 0 rgba(255,255,255,.05) inset,0 22px 50px -28px rgba(0,0,0,.9),0 6px 16px -10px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{
  --paper:#17201a; --paper2:#1f2a22; --card:#1d2820; --card2:#223026;
  --ink:#f1e8cf; --ink2:#b9b39c; --line:rgba(241,232,207,.45); --hair:rgba(241,232,207,.13);
  --jungle:#9cc7a4; --leaf:#86b58f; --sage:#2f4535; --lime:#c9da74; --hib:#f0749a; --blush:#5a2a3b; --mango:#f2ab4a; --sea:#4fb6b4; --gold:#efc46a;
  --glass:rgba(23,32,26,.72); --bg:#0d1a1c; color-scheme:dark;
  --sh1:0 1px 0 rgba(255,255,255,.05) inset,0 22px 50px -28px rgba(0,0,0,.9),0 6px 16px -10px rgba(0,0,0,.6)}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 90px;min-height:100vh;overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(180deg,#e9b98f 0%,#f4d9b0 44%,#5f9ea0 46%,#1f5a63 100%)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
#sky{position:fixed;inset:0;width:100vw;height:100vh;z-index:-1;display:block}
#petals{position:fixed;inset:0;width:100vw;height:100vh;z-index:40;pointer-events:none}
.wrap{max-width:1140px;margin:0 auto;display:grid;gap:24px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hib);outline-offset:3px}
h1,h2,h3{font-family:var(--f-disp);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
a{color:inherit}
::selection{background:var(--blush)}

/* NAV */
.navbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:35}
.nav{position:relative;display:flex;gap:2px;align-items:center;background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);
  border:1.5px solid var(--line);border-radius:999px;padding:5px;overflow-x:auto;scrollbar-width:none;box-shadow:var(--sh1)}
.nav::-webkit-scrollbar{display:none}
.nav a{position:relative;z-index:1;flex:1 0 auto;text-align:center;text-decoration:none;font-family:var(--f-deco);font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;font-size:12.5px;padding:9px 13px;border-radius:999px;white-space:nowrap;transition:color .35s}
.nav a.on{color:var(--paper)}
.nav .ind{position:absolute;z-index:0;top:5px;bottom:5px;border-radius:999px;background:var(--ink);box-shadow:0 6px 14px -6px rgba(0,0,0,.5);
  transition:left .55s cubic-bezier(.3,1.35,.5,1),width .55s cubic-bezier(.3,1.35,.5,1)}

/* PANELS */
.panel{position:relative;background:var(--paper);border:1.5px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:var(--sh1);isolation:isolate}
.panel::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.55;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .28 0 0 0 0 .18 0 0 0 .16 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.panel.win{background:transparent;border-color:rgba(251,244,225,.75);color:var(--onimg)}
.panel.win::before{display:none}
.pad{padding:clamp(22px,4.2vw,48px)}
.view{display:grid;gap:24px}
.view.enter{animation:enter .75s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(18px) scale(.985);filter:blur(4px)}}
.pre{opacity:0;transform:translateY(34px)}
.rv{transition:opacity .9s cubic-bezier(.2,.8,.2,1),transform .9s cubic-bezier(.2,.8,.2,1)}
.eyebrow{font-family:var(--f-deco);font-weight:700;text-transform:uppercase;letter-spacing:.18em;font-size:12px;color:var(--ink2)}
.h-sec{font-size:clamp(34px,5.6vw,60px);line-height:.95;text-transform:uppercase}
.muted{color:var(--ink2)}
.small{font-size:13px}
.divider{display:flex;align-items:center;gap:12px;color:var(--ink2);margin:6px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--hair)}
.divider svg{width:34px;height:20px}

/* HERO */
.hero{min-height:560px;display:grid;place-items:center;text-align:center;padding:110px 20px 70px}
.hero .inner{position:relative;z-index:3;max-width:720px}
.hero h1{font-size:clamp(56px,12vw,136px);line-height:.82;text-transform:uppercase;letter-spacing:.015em;color:var(--ink)}
.hero h1 .w{display:inline-block;white-space:nowrap;animation:none}
.hero h1 span{display:inline-block;animation:letter 1s cubic-bezier(.2,.9,.25,1.2) both;animation-delay:calc(var(--i)*70ms + .15s)}
@keyframes letter{from{opacity:0;transform:translateY(40px) rotate(8deg)}}
.hero .thai{font-family:var(--f-thai);font-weight:300;font-size:clamp(18px,2.6vw,26px);color:var(--hib);margin-top:4px;letter-spacing:.06em;animation:enter 1s .7s both}
.hero .sub{font-family:var(--f-disp);font-size:clamp(22px,3.4vw,38px);text-transform:uppercase;margin-top:10px;animation:enter 1s .85s both}
.hero p{max-width:46ch;margin:10px auto 0;font-size:14.5px;color:var(--ink2);animation:enter 1s 1s both}
.cluster{position:absolute;z-index:2;pointer-events:none;transition:transform .9s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 14px 14px rgba(20,40,25,.28))}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 7s ease-in-out infinite}
.sway.b{animation-duration:9s;animation-delay:-3s}.sway.c{animation-duration:6s;animation-delay:-1.4s}.sway.d{animation-duration:11s;animation-delay:-5s}
.sway.ctr{transform-origin:50% 50%;animation-name:breathe}
@keyframes sway{0%,100%{transform:rotate(-2.6deg)}50%{transform:rotate(2.8deg)}}
@keyframes breathe{0%,100%{transform:rotate(-4deg) scale(1)}50%{transform:rotate(4deg) scale(1.04)}}
.bloom{transform-box:fill-box;transform-origin:50% 50%;animation:bloom 1.4s cubic-bezier(.2,.9,.25,1.15) both;animation-delay:var(--d,0s)}
@keyframes bloom{from{transform:scale(.2) rotate(-70deg);opacity:0}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.4s cubic-bezier(.2,.9,.25,1) both;animation-delay:var(--d,0s)}
@keyframes grow{from{transform:scaleY(.1) rotate(-12deg);opacity:0}}

.badge{position:absolute;z-index:4;right:clamp(14px,6%,70px);top:84px;background:var(--lime);color:#1d2a22;border:1.5px solid #1d2a22;border-radius:50%;
  width:142px;height:90px;display:grid;place-items:center;text-align:center;font-family:var(--f-deco);font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.12em;line-height:1.25;
  transform:rotate(-8deg);animation:wob 6s ease-in-out infinite;box-shadow:0 10px 20px -12px rgba(0,0,0,.5)}
.badge b{display:block;font-size:22px;letter-spacing:.08em;font-variant-numeric:tabular-nums}
@keyframes wob{50%{transform:rotate(-2deg) translateY(-4px)}}

/* BUTTONS */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:10px 20px;cursor:pointer;text-decoration:none;
  font-family:var(--f-deco);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:12px;transition:transform .25s cubic-bezier(.3,1.5,.5,1),background .25s,color .25s,box-shadow .25s;white-space:nowrap}
.btn::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);transition:left .6s}
.btn:hover{transform:translateY(-2px)}
.btn:hover::after{left:130%}
.btn:active{transform:translateY(0) scale(.97)}
.btn svg{width:16px;height:16px}
.btn.dark{background:var(--ink);color:var(--paper);box-shadow:0 10px 18px -12px rgba(0,0,0,.7)}
.btn.pink{background:var(--hib);border-color:var(--hib);color:#fff;box-shadow:0 10px 20px -10px rgba(224,79,122,.7)}
.btn.sm{padding:7px 13px;font-size:11px}
.btn.ghost{border-color:var(--hair)}
.btn.onimg{border-color:var(--onimg);color:var(--onimg)}
.btn.gold{background:linear-gradient(180deg,#f7d98c,#e2a94b);border-color:#e2a94b;color:#1d1a12;box-shadow:0 0 30px -6px rgba(242,199,107,.7)}
.btn-stone{margin-top:26px;background:#1d2a22;color:#f7efd9;border-radius:50%/62%;padding:16px 52px;font-size:13px;border-color:#1d2a22;animation:enter 1s 1.15s both}
.btn-stone::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.2) 1px,transparent 1.6px) 0 0/9px 9px,radial-gradient(circle at 60% 70%,rgba(255,255,255,.12) 1px,transparent 1.4px) 0 0/13px 13px;pointer-events:none}

/* COUNTDOWN */
.count{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap;perspective:400px}
.count .cd{min-width:76px;border:1.5px solid var(--line);border-radius:16px;padding:8px 10px 6px;background:linear-gradient(180deg,var(--card),var(--card2));box-shadow:0 10px 18px -14px rgba(0,0,0,.6)}
.count b{display:block;font-family:var(--f-disp);font-size:38px;line-height:1.05;font-variant-numeric:tabular-nums;font-weight:400;overflow:hidden}
.count b span{display:inline-block}
.count .flip{animation:flip .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes flip{from{transform:translateY(-70%) rotateX(80deg);opacity:0}}
.count small{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:var(--ink2);font-family:var(--f-deco);font-weight:700}

/* WINDOW (sea view) */
.window{min-height:clamp(340px,46vw,480px);display:grid;align-items:end;padding:clamp(20px,4vw,44px)}
.window .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(5,20,25,.55));z-index:0}
.window .content{position:relative;z-index:2;display:grid;gap:12px}
.window h2{font-size:clamp(44px,8.5vw,104px);line-height:.88;text-transform:uppercase;text-shadow:0 6px 40px rgba(0,0,0,.35);letter-spacing:.03em}
.window .eyebrow{color:var(--onimg);opacity:.9}
.timebar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:rgba(10,25,28,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(251,244,225,.35);border-radius:18px;padding:12px 16px;max-width:620px}
.timebar input[type=range]{flex:1 1 180px;accent-color:#f2c76b}
.timebar b{font-family:var(--f-disp);font-size:28px;font-weight:400;font-variant-numeric:tabular-nums;min-width:74px}

/* GRID / CARDS */
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr))}
.box{position:relative;border:1.5px solid var(--line);border-radius:22px;background:linear-gradient(170deg,var(--card),var(--card2));padding:22px;min-width:0;
  box-shadow:0 18px 30px -26px rgba(0,0,0,.6);transition:transform .45s cubic-bezier(.2,.9,.3,1.2),box-shadow .45s}
.box.lift:hover{transform:translateY(-6px);box-shadow:0 28px 40px -26px rgba(0,0,0,.6)}
.box h3{font-size:26px;text-transform:uppercase;line-height:1.02}
.num{position:absolute;top:-16px;left:-12px;width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--f-disp);font-size:22px;
  box-shadow:0 0 0 4px var(--paper),0 0 0 5.5px var(--gold)}
.stat{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.stat b{font-family:var(--f-disp);font-weight:400;font-size:52px;line-height:1}
.bar{height:9px;border-radius:9px;background:var(--hair);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf),var(--lime));border-radius:9px;transition:width 1.2s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 2.4s infinite}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.3px solid var(--hair);background:var(--card);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .25s cubic-bezier(.3,1.4,.5,1)}
.chip:hover{border-color:var(--ink);transform:translateY(-1px)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink);box-shadow:0 6px 12px -8px rgba(0,0,0,.6)}
.chip svg{width:15px;height:15px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--paper2);color:var(--ink2)}
.tag svg{width:12px;height:12px}
.tag.p{background:var(--blush);color:var(--ink)}
.tag.g{background:var(--sage);color:var(--ink)}
.tag.y{background:var(--lime);color:#1d2a22}
label.f,.f{display:grid;gap:6px;font-size:12px;color:var(--ink2);font-weight:700;letter-spacing:.02em;min-width:0}
.in{width:100%;border:1.3px solid var(--hair);background:var(--paper);border-radius:14px;padding:10px 13px;font-size:14px;color:var(--ink);min-width:0;transition:border-color .2s,box-shadow .2s}
.in:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 4px var(--blush)}
textarea.in{resize:vertical;min-height:80px}
.form{display:grid;gap:13px}
.frow{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr))}
.empty{border:1.5px dashed var(--hair);border-radius:18px;padding:24px;text-align:center;color:var(--ink2);display:grid;gap:10px;justify-items:center}

/* POLAROIDS */
.wgrid{display:grid;gap:22px 18px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.pol{position:relative;background:#fffdf7;border:1px solid rgba(0,0,0,.08);padding:8px 8px 12px;border-radius:4px;box-shadow:0 14px 22px -16px rgba(0,0,0,.6);cursor:pointer;
  transform:rotate(var(--r,0deg));transition:transform .5s cubic-bezier(.3,1.4,.5,1),box-shadow .4s;color:#1d2a22;min-width:0}
.pol::before{content:"";position:absolute;left:50%;top:-9px;width:56px;height:18px;transform:translateX(-50%) rotate(-3deg);background:rgba(217,233,140,.8);box-shadow:0 1px 2px rgba(0,0,0,.1);z-index:2}
.pol:nth-child(3n)::before{background:rgba(249,205,216,.9);transform:translateX(-50%) rotate(4deg)}
.pol:hover{transform:rotate(0) translateY(-8px) scale(1.04);box-shadow:0 26px 34px -18px rgba(0,0,0,.6);z-index:3}
.pol img,.pol .ph{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:2px;display:block;background:linear-gradient(135deg,#efe6cf,#e3d6b5)}
.pol img{animation:develop 1.4s ease-out both}
@keyframes develop{from{filter:brightness(1.8) saturate(0) blur(3px)}}
.pol .cap{font-family:var(--f-hand);font-weight:700;font-size:19px;line-height:1.05;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pol .who{font-size:11px;color:#6b6457}
.pol.sel{outline:3px solid var(--hib);outline-offset:3px}
.pol .fav{position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.92);display:grid;place-items:center;cursor:pointer;color:#b9b2a3;box-shadow:0 4px 8px -4px rgba(0,0,0,.4);transition:transform .3s cubic-bezier(.3,1.8,.5,1)}
.pol .fav.on{color:#e04f7a}
.pol .fav:active{transform:scale(1.4)}
.pol .fav svg{width:16px;height:16px}
.upl{display:grid;place-items:center;aspect-ratio:3/4.5;border:1.8px dashed var(--line);border-radius:12px;cursor:pointer;text-align:center;padding:14px;gap:6px;transition:all .3s;background:var(--card)}
.upl:hover{background:var(--paper2);transform:translateY(-4px)}
.upl .plus{font-family:var(--f-disp);font-size:56px;line-height:1;color:var(--hib);animation:pulse 2.4s ease-in-out infinite;display:grid;place-items:center}
@keyframes pulse{50%{transform:scale(1.15)}}

/* LOOK BOARD */
.board{position:relative;aspect-ratio:4/4.6;max-width:100%;border-radius:22px;border:1.5px solid var(--line);overflow:hidden;
  background:radial-gradient(circle at 1px 1px,var(--hair) 1px,transparent 1.5px) 0 0/20px 20px,linear-gradient(160deg,var(--card),var(--card2));touch-action:none}
.bi{position:absolute;width:30%;transform:translate(-50%,-50%) rotate(var(--r,0deg));cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;animation:drop .6s cubic-bezier(.3,1.4,.5,1) both}
.bi .pol{padding:6px 6px 8px;transform:none;cursor:grab;transition:transform .2s,box-shadow .2s}
.bi .pol:hover{transform:none}
.bi.drag{cursor:grabbing;z-index:99!important}
.bi.drag .pol{box-shadow:0 30px 40px -16px rgba(0,0,0,.6);transform:scale(1.06)}
.bi img{pointer-events:none;-webkit-user-drag:none}
.bx{position:absolute;right:-8px;top:-8px;z-index:3;width:26px;height:26px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .2s}
.bx svg{width:13px;height:13px}
.bi:hover .bx,.bi:focus-within .bx{opacity:1}
@media (hover:none){.bx{opacity:1}}
@keyframes drop{from{transform:translate(-50%,-90%) rotate(-25deg) scale(.6);opacity:0}}
.board .stamp{position:absolute;left:16px;bottom:12px;font-family:var(--f-hand);font-size:26px;color:var(--ink2);opacity:.85;pointer-events:none}
.looks{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.look{border:1.5px solid var(--line);border-radius:20px;background:linear-gradient(170deg,var(--card),var(--card2));padding:12px;display:grid;gap:9px;min-width:0;transition:transform .45s cubic-bezier(.2,.9,.3,1.2)}

.mb{position:relative;aspect-ratio:4/4.6;border-radius:14px;background:radial-gradient(circle at 1px 1px,var(--hair) 1px,transparent 1.5px) 0 0/12px 12px,var(--paper);overflow:hidden}
.mb img,.mb .ph{position:absolute;width:30%;aspect-ratio:3/4;object-fit:cover;transform:translate(-50%,-50%) rotate(var(--r));border:3px solid #fffdf7;border-bottom-width:7px;box-shadow:0 6px 10px -6px rgba(0,0,0,.5);background:#efe6cf}
.hint{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--hair);padding:10px 14px;background:var(--card);border-radius:14px;font-size:13px;animation:enter .5s}
.hint svg{flex:none;width:20px;height:20px;color:var(--mango)}

/* PLAN */
.days{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 12px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.day{flex:0 0 auto;scroll-snap-align:start;border:1.5px solid var(--hair);border-radius:18px;padding:8px 12px;text-align:center;cursor:pointer;background:var(--card);min-width:76px;transition:all .35s cubic-bezier(.3,1.4,.5,1)}
.day b{display:block;font-family:var(--f-disp);font-size:30px;font-weight:400;line-height:1}
.day span{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink2);font-weight:700}
.day i{display:flex;gap:3px;justify-content:center;height:6px;margin-top:5px}
.day i u{width:6px;height:6px;border-radius:50%;background:var(--hib)}
.day:hover{transform:translateY(-3px)}
.day.on{background:var(--ink);color:var(--paper);border-color:var(--ink);transform:translateY(-4px) scale(1.05);box-shadow:0 12px 20px -12px rgba(0,0,0,.6)}
.day.on span{color:var(--paper)}
.day.ny{border-color:var(--gold);background:linear-gradient(180deg,var(--card),var(--card2))}
.day.ny.on{background:linear-gradient(180deg,#203448,#0f1c26);color:#f6e7c1}
.tl{position:relative;display:grid;gap:12px;padding-left:22px;margin-top:14px}
.tl::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--hib),var(--mango),var(--leaf));border-radius:2px}
.ev{position:relative;display:grid;grid-template-columns:58px 1fr auto;gap:12px;padding:12px 14px;border-radius:16px;background:var(--paper);border:1px solid var(--hair);align-items:start;transition:transform .3s}
.ev:hover{transform:translateX(4px)}
.ev::before{content:"";position:absolute;left:-21px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:3px solid var(--c,var(--hib))}
.ev time{font-family:var(--f-disp);font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.ev .t{font-weight:800}
.ev a{color:var(--sea);font-weight:600}
.mini{display:flex;gap:4px;margin-top:8px}
.mini img{width:36px;height:46px;object-fit:cover;border-radius:4px;border:2px solid #fffdf7;box-shadow:0 3px 6px -3px rgba(0,0,0,.5)}
.iconbtn{border:0;background:transparent;cursor:pointer;padding:7px;border-radius:10px;color:var(--ink2);transition:all .2s}
.iconbtn:hover{background:var(--paper2);color:var(--ink);transform:scale(1.1)}
.iconbtn svg{width:18px;height:18px;display:block}
.clim{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.clim div{background:var(--paper);border:1px solid var(--hair);border-radius:14px;padding:8px;text-align:center}
.clim b{display:block;font-family:var(--f-disp);font-size:24px;font-weight:400;line-height:1.1}
.clim span{font-size:10.5px;color:var(--ink2);font-weight:700;text-transform:uppercase;letter-spacing:.08em}

/* PLACES */
.pl{position:relative;border-radius:22px;overflow:hidden;min-height:270px;display:grid;align-content:end;padding:18px;color:#fbf4e1;border:1.5px solid var(--line);transition:transform .5s cubic-bezier(.2,.9,.3,1.2),box-shadow .5s;box-shadow:0 20px 30px -24px rgba(0,0,0,.7)}
.pl:hover{transform:translateY(-6px) rotate(-.5deg);box-shadow:0 30px 40px -24px rgba(0,0,0,.7)}
.pl .art{position:absolute;inset:0;z-index:0}
.pl .art svg{width:100%;height:100%;display:block}
.pl::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 25%,rgba(0,0,0,.6));z-index:0}
.pl>*:not(.art){position:relative;z-index:1}
.pl h3{font-size:30px;text-transform:uppercase;line-height:1;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.pl .meta{font-size:12.5px;opacity:.92}
.pl.done{filter:saturate(.55)}
.pl .stamp{position:absolute;top:14px;right:14px;z-index:2;border:2px solid #fbf4e1;border-radius:50%;width:74px;height:74px;display:grid;place-items:center;font-family:var(--f-deco);font-weight:700;font-size:12px;letter-spacing:.1em;transform:rotate(14deg);text-transform:uppercase;background:rgba(224,79,122,.8);animation:stampin .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes stampin{from{transform:rotate(-20deg) scale(2.2);opacity:0}}
.likes{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.heart{border:1.5px solid rgba(251,244,225,.8);background:rgba(0,0,0,.2);color:#fbf4e1;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;gap:5px;align-items:center;transition:all .25s cubic-bezier(.3,1.6,.5,1)}
.heart svg{width:14px;height:14px}
.heart.on{background:#e04f7a;border-color:#e04f7a}
.heart:active{transform:scale(1.2)}

.ny-hero{color:#f6ecd2;text-align:center;padding:84px 20px 56px;min-height:540px;border-color:rgba(246,236,210,.55)}
.ny-hero .veil{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 0%,rgba(8,14,28,.72),rgba(8,14,28,.15) 70%);z-index:0}
.ny-hero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.ny-hero .inner{position:relative;z-index:2;pointer-events:none}
.ny-hero .inner button{pointer-events:auto}
.ny-hero h2{font-size:clamp(64px,13vw,160px);line-height:.82;text-transform:uppercase;background:linear-gradient(180deg,#fff7dc 10%,#f2c76b 55%,#b9792c);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 30px rgba(242,199,107,.35));animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 6px 50px rgba(242,199,107,.6))}}
.ny-hero .eyebrow{color:#e6dcc0}
.ny-hero .count .cd{background:rgba(255,255,255,.07);border-color:rgba(246,236,210,.4);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ny-hero .count small{color:#e6dcc0}
.ny-hero p{color:#e6dcc0;max-width:54ch;margin:14px auto 0;font-size:14.5px}
.mos{display:inline-flex;gap:8px;align-items:center;margin-top:12px;font-size:13px;color:#e6dcc0;background:rgba(255,255,255,.07);border:1px solid rgba(246,236,210,.3);border-radius:999px;padding:6px 14px}
.lst{display:grid;gap:0}
.it{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px dashed var(--hair);min-width:0}
.it .tx{min-width:0;overflow-wrap:anywhere}
.it .tx b{font-weight:700}
.it.done .tx{color:var(--ink2)}
.it.done .tx>b,.it.done .tx>span.s{text-decoration:line-through;text-decoration-color:var(--hib);text-decoration-thickness:2px}
.ck{width:24px;height:24px;border-radius:8px;border:1.6px solid var(--ink);display:grid;place-items:center;cursor:pointer;background:var(--paper);padding:0;transition:all .3s cubic-bezier(.3,1.6,.5,1)}
.ck svg{width:15px;height:15px;opacity:0;transform:scale(.3) rotate(-30deg);transition:all .35s cubic-bezier(.3,1.8,.5,1)}
.ck:hover{transform:scale(1.1)}
.done .ck{background:var(--leaf);border-color:var(--leaf);color:#fff}
.done .ck svg{opacity:1;transform:scale(1)}
.addrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.addrow .in{flex:1 1 140px}
.addrow .in.s{flex:0 1 100px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding-top:12px;border-top:1.5px solid var(--line);font-family:var(--f-disp);font-size:28px;flex-wrap:wrap;gap:6px}
.sched .it{grid-template-columns:64px 1fr auto}
.sched time{font-family:var(--f-disp);font-size:24px;font-variant-numeric:tabular-nums}
.sched .it.now{background:linear-gradient(90deg,var(--lime),transparent);border-radius:12px}
.wish{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.wish>div{background:#e5f0a6;color:#1d2a22;padding:16px 14px 12px;border-radius:3px;transform:rotate(var(--r));box-shadow:0 12px 18px -12px rgba(0,0,0,.55);position:relative;min-width:0;overflow-wrap:anywhere;
  font-family:var(--f-hand);font-size:22px;line-height:1.1;transition:transform .3s}
.wish>div:hover{transform:rotate(0) scale(1.04)}
.wish>div:nth-child(3n+2){background:#fbd3dd}
.wish>div:nth-child(3n){background:#f8e1a8}
.wish small{display:block;margin-top:8px;font-family:var(--f-deco);font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.1em}
.wish .iconbtn{position:absolute;top:2px;right:2px;color:#1d2a22;padding:4px}
.secret{background:linear-gradient(160deg,#21324a,#121d2b);color:#f2e7c7;border-color:rgba(242,199,107,.55)}
.secret .muted{color:#c7bb9a}
.secret .in{background:rgba(255,255,255,.06);color:#f2e7c7;border-color:rgba(242,199,107,.3)}
.secret .it{border-color:rgba(242,199,107,.2)}
.secret .ck{border-color:#f2c76b;background:transparent}
.secret .iconbtn{color:#c7bb9a}
.secret .num{box-shadow:0 0 0 4px #21324a,0 0 0 5.5px var(--gold)}
.lock{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#f2c76b;margin-top:4px}
.lock svg{width:14px;height:14px}

/* BUDGET */
.donut{width:190px;height:190px;flex:none}
.legend{display:grid;gap:6px;font-size:13px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.owe{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-family:var(--f-disp);font-size:clamp(26px,4vw,38px);line-height:1.1}
.owe svg{width:60px;height:24px;color:#e04f7a}
.exp{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px dashed var(--hair)}
.exp .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:#fff}
.exp .ic svg{width:18px;height:18px}
.exp .sum{font-family:var(--f-disp);font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* DIARY */
.diary{display:grid;gap:28px}
.dent{display:grid;grid-template-columns:minmax(0,220px) 1fr;gap:22px;align-items:start}
.dent:nth-child(even){grid-template-columns:1fr minmax(0,220px)}
.dent:nth-child(even) .pol{order:2}
.dent .note{background:var(--card);border:1px solid var(--hair);border-radius:4px 18px 18px 18px;padding:16px 18px;box-shadow:0 14px 22px -18px rgba(0,0,0,.6);position:relative}
.dent .note p{margin:6px 0 0;font-family:var(--f-hand);font-size:24px;line-height:1.15}
@media (max-width:560px){.dent,.dent:nth-child(even){grid-template-columns:1fr}.dent:nth-child(even) .pol{order:0}.dent .pol{max-width:220px;margin:auto}}

/* PACK */
.ring{width:130px;height:130px;flex:none}
.phr{display:grid;gap:8px}
.phr div{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--paper);border:1px solid var(--hair)}
.phr b{font-family:var(--f-thai);font-weight:400;color:var(--hib);font-size:17px}
.phr span{font-size:13px;grid-column:1}
.phr button{grid-row:1/3;grid-column:2}
.pgroup{border:1px solid var(--hair);border-radius:16px;padding:6px 12px 10px;background:var(--paper);margin-top:10px}
.pgroup summary{cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:6px 0;list-style:none;font-family:var(--f-deco);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:12px}
.pgroup summary::-webkit-details-marker{display:none}
.pgroup summary em{font-style:normal;font-family:var(--f-body);font-size:12px;color:var(--ink2);letter-spacing:0;text-transform:none}

/* MODAL / TOAST */
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,25,20,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));animation:fade .3s}
@keyframes fade{from{opacity:0}}
.modal .sheet{position:relative;background:var(--paper);border:1.5px solid var(--line);border-radius:26px;width:min(580px,100%);max-height:100%;overflow:auto;padding:26px;animation:pop .45s cubic-bezier(.2,.9,.3,1.2);box-shadow:var(--sh1)}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.96)}}
.modal h3{font-size:34px;text-transform:uppercase;margin-bottom:12px;padding-right:30px}
.prev{width:100%;max-height:280px;object-fit:contain;border-radius:16px;background:var(--paper2)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:999px;z-index:70;font-size:14px;font-weight:600;animation:tpop .4s cubic-bezier(.2,.9,.3,1.3);max-width:calc(100% - 32px);box-shadow:0 14px 30px -12px rgba(0,0,0,.6)}
@keyframes tpop{from{opacity:0;transform:translate(-50%,20px) scale(.9)}}
.conf{position:fixed;width:9px;height:9px;pointer-events:none;z-index:80;border-radius:2px}
.sync{font-size:12px;color:var(--ink2);display:inline-flex;align-items:center;gap:7px;font-weight:600}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--mango)}
.sync.live i{background:var(--leaf);animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(63,122,79,.5)}100%{box-shadow:0 0 0 10px rgba(63,122,79,0)}}
.foot{text-align:center;color:#fbf4e1;font-family:var(--f-deco);font-weight:700;letter-spacing:.24em;text-transform:uppercase;font-size:12px;text-shadow:0 2px 10px rgba(0,0,0,.4)}
@media (max-width:640px){
  .badge{width:108px;height:70px;font-size:9px;top:66px;right:8px}.badge b{font-size:17px}
  .hero{padding-top:170px;min-height:600px}.ny-hero h2{font-size:clamp(48px,15vw,90px)}.mos{display:block;border-radius:16px}.hero h1{font-size:clamp(46px,14.5vw,90px)}
  .ev{grid-template-columns:50px 1fr auto;gap:8px;padding:10px}
  .clim{grid-template-columns:repeat(2,1fr)}
  .count .cd{min-width:64px}.count b{font-size:30px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.pre{opacity:1;transform:none}}

 if(b.dataset.a==='ck'){if(!o.done)confetti(e.clientX,e.clientY);await upd(c,id,{done:!o.done})}
 else if(b.dataset.a==='del')await del(c,id);
 else if(b.dataset.a==='cart'){const parts=(o.ing||'').split(',').map(x=>x.trim()).filter(Boolean);const have=new Set(S.ny_shop.map(x=>x.name.toLowerCase()));let n=0;for(const p of parts){if(!have.has(p.toLowerCase())){await add('ny_shop',{name:p,qty:'',price:'',cat:'Продукты',who:o.who||'both',done:false});n++}}toast(n?`В покупки добавлено: ${n}`:'Всё уже есть в списке')}}}

  modal(`<h3>${esc(o.name)}</h3><div class="form"><div class="frow"><label class="f" for="pq">Сколько<input class="in" id="pq" value="${esc(o.qty||'')}"></label><label class="f" for="pp">Цена, ฿<input class="in" id="pp" type="number" inputmode="decimal" value="${esc(o.price||'')}"></label></div><div class="f">Кто покупает<div class="chips" id="pw"></div></div><div class="row"><button class="btn" data-close>Отмена</button><button class="btn dark" id="ps">Сохранить</button></div></div>`,(sh,cl)=>{

/* fireworks over the night sea */
const FW={run:false,P:[],R:[],c:null,x:null,last:0,
 start(){this.c=$('#fw');if(!this.c)return;this.x=this.c.getContext('2d');this.resize();this.P=[];this.R=[];if(RM){this.burst(this.w*.3,this.h*.3);this.burst(this.w*.7,this.h*.25);this.step();return}if(!this.run){this.run=true;requestAnimationFrame(t=>this.loop(t))}},
 resize(){const r=this.c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);this.c.width=Math.max(1,r.width*d);this.c.height=Math.max(1,r.height*d);this.x.setTransform(d,0,0,d,0,0);this.w=r.width;this.h=r.height},
 launch(){if(!this.c)return;const tx=this.w*(.15+Math.random()*.7),ty=this.h*(.12+Math.random()*.3);this.R.push({x:tx+(Math.random()-.5)*60,y:this.h,tx,ty,v:7+Math.random()*3})},
 burst(x,y){const types=['peony','ring','willow','crackle'];const ty=types[Math.floor(Math.random()*4)];const pal=[['#ffe6a8','#f2c76b'],['#f9cdd8','#e04f7a'],['#e8f3a6','#a8d16b'],['#ffffff','#b9e3ff'],['#ffd1a1','#f2a33a']][Math.floor(Math.random()*5)];
  const n=ty==='ring'?70:ty==='willow'?90:110;
  for(let i=0;i<n;i++){const a=Math.PI*2*i/n+(ty==='ring'?0:Math.random()*.2);const v=ty==='ring'?3.2:ty==='willow'?1.6+Math.random()*2:1+Math.random()*3.6;
   this.P.push({x,y,px:x,py:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,dl:ty==='willow'?.006:.012+Math.random()*.006,col:pal[i%2],g:ty==='willow'?.035:.045,cr:ty==='crackle'})}
  if(ty==='crackle'&&!RM)setTimeout(()=>{for(let i=0;i<40;i++)this.P.push({x:x+(Math.random()-.5)*120,y:y+(Math.random()-.5)*120,px:0,py:0,vx:0,vy:0,l:.6,dl:.05,col:'#fff',g:0,spark:1})},500)},
 step(){const x=this.x;x.globalCompositeOperation='lighter';for(let k=0;k<25;k++)for(const p of this.P){p.px=p.x;p.py=p.y;p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.982;p.vy*=.982;p.l-=p.dl*.3;x.globalAlpha=Math.max(p.l,0)*.4;x.strokeStyle=p.col;x.beginPath();x.moveTo(p.px,p.py);x.lineTo(p.x,p.y);x.stroke()}x.globalAlpha=1},
 loop(t){if(!this.c||!document.body.contains(this.c)){this.run=false;return}
  const x=this.x;x.globalCompositeOperation='destination-out';x.fillStyle='rgba(0,0,0,.22)';x.fillRect(0,0,this.w,this.h);x.globalCompositeOperation='lighter';
  if(t-this.last>1500&&!document.hidden){this.launch();if(Math.random()<.4)setTimeout(()=>this.launch(),250);this.last=t}
  this.R=this.R.filter(r=>{const dx=r.tx-r.x,dy=r.ty-r.y;const d=Math.hypot(dx,dy);if(d<r.v){this.burst(r.tx,r.ty);return false}const px=r.x,py=r.y;r.x+=dx/d*r.v;r.y+=dy/d*r.v;
   x.globalAlpha=1;x.strokeStyle='rgba(255,220,160,.9)';x.lineWidth=2;x.beginPath();x.moveTo(px,py);x.lineTo(r.x,r.y);x.stroke();return true});
  this.P=this.P.filter(p=>p.l>0);for(const p of this.P){p.px=p.x;p.py=p.y;p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.982;p.vy*=.982;p.l-=p.dl;
   x.globalAlpha=Math.max(p.l,0)*(p.cr&&Math.random()<.3?.2:1);
   if(p.spark){x.fillStyle=p.col;x.fillRect(p.x,p.y,1.6,1.6)}else{x.strokeStyle=p.col;x.lineWidth=1.8;x.beginPath();x.moveTo(p.px,p.py);x.lineTo(p.x,p.y);x.stroke()}}
  x.globalAlpha=1;requestAnimationFrame(tt=>this.loop(tt))}};

 const draw=()=>{if(!$('#bTop'))return;const s=ST(),n=s.names;const E=S.expenses;
  const paid=[0,0],used=[0,0];let total=0;E.forEach(e=>{const a=+e.amount||0;total+=a;paid[+e.payer||0]+=a;if(e.for==='both'){used[0]+=a/2;used[1]+=a/2}else used[+e.for||0]+=a});

   `<div class="box" style="grid-column:1/-1;background:linear-gradient(120deg,#e3f0a0,#fbf6e6);color:#1d2a22"><div class="eyebrow" style="color:#1d2a22">Расчёт</div><div class="owe" style="margin-top:6px">${Math.abs(bal)<1?'Вы в расчёте':`${esc(n[bal>0?1:0])} <svg viewBox="0 0 60 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12h52M46 4l8 8-8 8"/></svg> ${esc(n[bal>0?0:1])}: ${fmt(Math.abs(bal))} ฿`}</div>${Math.abs(bal)>=1?`<div class="small">≈ ${fmt(Math.abs(bal)*s.rate)} ₽ · стрелка показывает, кто кому переводит</div>`:''}</div>`;
  const by={};E.forEach(e=>by[e.cat]=(by[e.cat]||0)+(+e.amount||0));const ks=Object.keys(by).sort((a,b)=>by[b]-by[a]);
  let a0=-Math.PI/2;const R=80,r=50;const arcs=ks.map(k=>{let sw=by[k]/(total||1)*Math.PI*2;if(sw>=Math.PI*2)sw=Math.PI*2-.001;const a1=a0+sw;const lg=sw>Math.PI?1:0;const P=(a,rr)=>[(95+Math.cos(a)*rr).toFixed(2),(95+Math.sin(a)*rr).toFixed(2)];const [x1,y1]=P(a0,R),[x2,y2]=P(a1,R),[x3,y3]=P(a1,r),[x4,y4]=P(a0,r);
   const d=`M${x1} ${y1}A${R} ${R} 0 ${lg} 1 ${x2} ${y2}L${x3} ${y3}A${r} ${r} 0 ${lg} 0 ${x4} ${y4}Z`;a0=a1;return `<path d="${d}" fill="${EXPC[k]||'#888'}" stroke="var(--card)" stroke-width="2"><title>${k}</title></path>`}).join('');
  $('#bChart').innerHTML=total?`<svg class="donut" viewBox="0 0 190 190">${arcs}<text x="95" y="96" text-anchor="middle" font-family="Oranienbaum,serif" font-size="26" fill="var(--ink)">${fmt(total)}</text><text x="95" y="114" text-anchor="middle" font-size="11" fill="var(--ink2)">бат</text></svg><div class="legend">${ks.map(k=>`<div><i style="background:${EXPC[k]}"></i>${k} — <b>${fmt(by[k])} ฿</b> <span class="muted">${Math.round(by[k]/total*100)}%</span></div>`).join('')}</div>`:'<div class="empty" style="flex:1">Добавьте первую трату — появится диаграмма.</div>';
  $('#bCount').textContent=E.length?E.length+' записей':'';
  $('#bList').innerHTML=E.length?E.slice().sort((a,b)=>(b.created||0)-(a.created||0)).map(e=>`<div class="exp" data-id="${e.id}"><span class="ic" style="background:${EXPC[e.cat]||'#888'}">${EXPI[e.cat]||IC.dots}</span><div style="min-width:0"><b>${esc(e.title)}</b><div class="small muted">${esc(e.cat)} · платила ${esc(n[+e.payer||0])} · ${e.for==='both'?'пополам':'за '+esc(n[+e.for||0])}</div></div><span class="sum">${fmt(e.amount)} ฿</span><button class="iconbtn" data-a="del" aria-label="Удалить">${IC.x}</button></div>`).join(''):'<div class="small muted">Пока пусто.</div>';
 };
 $('#bList').onclick=async e=>{const b=e.target.closest('[data-a="del"]');if(!b)return;if(b.dataset.sure)await del('expenses',b.closest('[data-id]').dataset.id);else{b.dataset.sure=1;b.style.color='var(--hib)';toast('Нажмите ещё раз, чтобы удалить')}};
 $('#xAdd').onclick=async e=>{const t=$('#xT').value.trim(),a=+$('#xA').value;if(!t||!a){toast('Укажите, что и сколько');return}
  const fr=f.get();await add('expenses',{title:t,amount:a,cat:c.get(),payer:p.get(),for:fr==='both'?'both':String(fr)});$('#xT').value='';$('#xA').value='';confetti(e.clientX,e.clientY);toast('Трата записана')};
 REDRAW=draw;draw();
}

/* ---------- DIARY ---------- */
const camIcon=()=>IC.camera.replace('<svg','<svg width="44" height="44"');
function vDiary(){const ds=datesBetween(ST().start,ST().end);return `<section class="panel pad">
 ${cluster([['monstera',100,220,180,200,-10,'',0],flower('plmW',150,40,100,0,'',.3)],'0 0 220 230','right:-50px;top:-40px;width:min(210px,28vw);height:auto;opacity:.95',1)}
 ${sec('Воспоминания','Дневник поездки')}
 <p class="muted small" style="max-width:60ch;position:relative;z-index:3">Каждый вечер — одна фотография и пара строк. Вернётесь домой, а тут готовый альбом.</p>
 <div class="box" style="margin-top:20px"><div class="grid g2" style="align-items:start">
  <div class="form"><div class="frow"><label class="f" for="dyD">День<select class="in" id="dyD">${ds.map(d=>`<option value="${d}">${dLabel(d)}, ${dWeek(d)}</option>`).join('')}</select></label><div class="f">Кто пишет<div class="chips" id="dyW"></div></div></div>
   <label class="f" for="dyT">Что запомнилось<textarea class="in" id="dyT" placeholder="Сегодня мы впервые попробовали манго стики райс…"></textarea></label>
   <div class="f">Настроение<div class="chips" id="dyM"></div></div></div>
  <div class="form"><label class="upl" for="dyF" id="dyPrev" style="aspect-ratio:4/3"><div><div class="plus">${camIcon()}</div><div class="eyebrow">Фото дня</div></div></label><input type="file" id="dyF" accept="image/*" hidden>
   <button class="btn dark" id="dyAdd">Сохранить в дневник</button></div>
 </div></div>
 <div class="diary" id="dyList" style="margin-top:30px"></div>
</section>`}
function mountDiary(){
 const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok'}).format(new Date());if(datesBetween(ST().start,ST().end).includes(today))$('#dyD').value=today;
 const w=chipGroup($('#dyW'),whoOpts(),'both',false);const m=chipGroup($('#dyM'),MOODS.map(k=>({k,t:k})),'Счастье',false);let li=null;
 const resetPrev=()=>$('#dyPrev').innerHTML=`<div><div class="plus">${camIcon()}</div><div class="eyebrow">Фото дня</div></div>`;
 $('#dyF').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{li=await loadImg(f);$('#dyPrev').innerHTML=`<img src="${li.url}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:10px">`}catch(er){toast('Не получилось открыть фото')}};
 $('#dyAdd').onclick=async e=>{const btn=e.currentTarget;const t=$('#dyT').value.trim();if(!t&&!li){toast('Напишите пару строк или добавьте фото');return}btn.textContent='Сохраняем…';
  const d={day:$('#dyD').value,text:t,who:w.get(),mood:m.get()};if(li)Object.assign(d,await storePhoto(li));await add('diary',d);
  li=null;$('#dyT').value='';btn.textContent='Сохранить в дневник';resetPrev();confetti(e.clientX,e.clientY,30);toast('Записано в дневник')};
 const draw=()=>{const el=$('#dyList');if(!el)return;const ls=S.diary.slice().sort((a,b)=>(a.day||'').localeCompare(b.day||'')||byCreated(a,b));
  el.innerHTML=ls.length?ls.map(o=>`<div class="dent" data-id="${o.id}">${imgSrc(o)?`<div class="pol" style="--r:${rot(o.id)}">${imgTag(o)}<div class="cap">${dLabel(o.day)}</div></div>`:`<div class="pol" style="--r:${rot(o.id)}"><div class="ph" style="display:grid;place-items:center"><svg width="80" height="80" viewBox="-82 -82 164 164"><use href="#plmP" x="-82" y="-82" width="164" height="164"/></svg></div><div class="cap">${dLabel(o.day)}</div></div>`}
   <div class="note"><div class="row between"><span class="tag p">${esc(o.mood||'')}</span><span class="row" style="gap:2px"><span class="small muted">${esc(nm(o.who))}</span><button class="iconbtn" data-a="del" aria-label="Удалить">${IC.x}</button></span></div><p>${esc(o.text)}</p></div></div>`).join('')
   :`<div class="empty"><svg width="90" height="90" viewBox="-82 -82 164 164"><use href="#plmW" x="-82" y="-82" width="164" height="164"/></svg><span>Первая запись появится здесь — с фото и настроением дня.</span></div>`;
  el.onclick=async e=>{const b=e.target.closest('[data-a="del"]');if(!b)return;if(b.dataset.sure)await del('diary',b.closest('[data-id]').dataset.id);else{b.dataset.sure=1;b.style.color='var(--hib)';toast('Нажмите ещё раз, чтобы удалить')}}};
 REDRAW=draw;draw();
}

/* ---------- PACKING ---------- */
let PKW='all';
const PHR=[['สวัสดีค่ะ','Савади ка — здравствуйте'],['ขอบคุณค่ะ','Коп кун ка — спасибо'],['เท่าไหร่คะ','Тао рай ка? — сколько стоит?'],['ไม่เผ็ด','Май пет — не остро, пожалуйста'],['ลดได้ไหมคะ','Лот дай май ка? — можно скидку?'],['อร่อยมาก','Арой мак — очень вкусно'],['ไม่เป็นไร','Май пен рай — ничего страшного']];
function vPacking(){return `<section class="panel pad">
 ${cluster([['banana',140,300,90,300,14,'',0],['monstera',80,300,160,180,-8,'b',.2],flower('orchid',170,90,70,0,'',.4)],'0 0 220 300','right:-40px;bottom:-40px;width:min(210px,28vw);height:auto',1)}
 ${sec('Шаг последний','Собираем чемодан')}
 <div class="grid g2" style="margin-top:22px;align-items:start;position:relative;z-index:3">
  <div class="box"><div class="row" style="gap:22px"><svg class="ring" viewBox="0 0 130 130" id="ring"></svg><div><div class="eyebrow">Готово</div><div id="pkTxt" style="font-family:var(--f-disp);font-size:36px;line-height:1.1"></div><div class="chips" id="pkW" style="margin-top:10px"></div></div></div>
   <div id="pk" style="margin-top:8px"></div>
   <div class="addrow"><input class="in" id="pkX" placeholder="Что положить" aria-label="Что положить"><select class="in s" id="pkG" aria-label="Группа">${PACKG.map(g=>`<option>${g}</option>`).join('')}</select><select class="in s" id="pkWh" aria-label="Чьё">${whoOpts().map(o=>`<option value="${o.k}" ${o.k==='both'?'selected':''}>${esc(o.t)}</option>`).join('')}</select><button class="btn sm dark" id="pkAdd">Добавить</button></div></div>
  <div class="grid" style="gap:18px">
   <div class="box"><h3>Тайский для двоих</h3><p class="small muted">Девушки заканчивают фразы на «ка» — так вежливо. Нажмите динамик, чтобы послушать.</p>
    <div class="phr" style="margin-top:10px">${PHR.map(([t,r],i)=>`<div><b>${t}</b><span>${r}</span><button class="iconbtn" data-say="${i}" aria-label="Послушать">${IC.sound}</button></div>`).join('')}</div></div>
   <div class="box"><h3>Калькулятор бат</h3>
    <div class="frow" style="margin-top:10px"><label class="f" for="cTHB">Баты ฿<input class="in" id="cTHB" type="number" inputmode="decimal" value="1000"></label><label class="f" for="cRUB">Рубли ₽<input class="in" id="cRUB" type="number" inputmode="decimal"></label></div>
    <p class="small muted">По вашему курсу ${esc(ST().rate)} ₽ за бат.</p></div>
  </div></div></section>`}
function mountPacking(){
 let cel=false;
 const draw=()=>{if(!$('#pk'))return;const list=S.packing.filter(p=>PKW==='all'||String(p.who)===String(PKW)||p.who==='both');const done=list.filter(p=>p.done).length,tot=list.length||1,pc=done/tot;
  $('#pkTxt').textContent=`${done} из ${list.length}`;
  $('#ring').innerHTML=`<defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3f7a4f"/><stop offset="1" stop-color="#c9da74"/></linearGradient></defs><circle cx="65" cy="65" r="54" fill="none" stroke="var(--hair)" stroke-width="12"/><circle cx="65" cy="65" r="54" fill="none" stroke="url(#rg)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(339*pc).toFixed(1)} 400" transform="rotate(-90 65 65)"/><text x="65" y="75" text-anchor="middle" font-family="Oranienbaum,serif" font-size="30" fill="var(--ink)">${Math.round(pc*100)}%</text>`;
  const open=new Set($$('#pk details[open]').map(d=>d.dataset.g));const first=!$('#pk details');
  $('#pk').innerHTML=list.length?PACKG.map(g=>{const a=list.filter(p=>(p.group||'Одежда')===g).sort(byCreated);if(!a.length)return '';const d=a.filter(x=>x.done).length;
   return `<details class="pgroup" data-g="${g}" ${first||open.has(g)?'open':''}><summary>${g}<em>${d}/${a.length}</em></summary><div class="lst">${a.map(o=>ckRow('packing',o,`<span class="s">${esc(o.text)}</span>${o.who!=='both'?` <span class="tag p">${esc(nm(o.who))}</span>`:''}`)).join('')}</div></details>`}).join('')
   :`<div class="empty"><span class="small">Список пуст</span><button class="btn sm" data-seed="packing">Добавить подсказки</button></div>`;
  if(list.length&&done===list.length&&!cel){cel=true;const r=$('#ring').getBoundingClientRect();confetti(r.left+65,r.top+65,60);toast('Чемодан собран! Таиланд ждёт')}};
 listClicks($('#pk'));
 chipGroup($('#pkW'),[{k:'all',t:'Всё'},...whoOpts(false)],PKW,false,v=>{PKW=v;draw()});
 const a=async()=>{const t=$('#pkX').value.trim();if(!t)return;const w=$('#pkWh').value;await add('packing',{text:t,group:$('#pkG').value,who:w==='both'?'both':+w,done:false});$('#pkX').value=''};
 $('#pkAdd').onclick=a;$('#pkX').addEventListener('keydown',e=>{if(e.key==='Enter')a()});
 const r=()=>ST().rate;$('#cRUB').value=Math.round(1000*r());
 $('#cTHB').oninput=e=>$('#cRUB').value=Math.round((+e.target.value||0)*r());$('#cRUB').oninput=e=>$('#cTHB').value=Math.round((+e.target.value||0)/r());
 $$('[data-say]').forEach(b=>b.onclick=()=>{try{const u=new SpeechSynthesisUtterance(PHR[+b.dataset.say][0]);u.lang='th-TH';u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){toast('Браузер не умеет озвучивать')}});
 REDRAW=draw;draw();
}

/* ---------- settings ---------- */

 <div class="frow"><label class="f" for="sP">Куда летим<input class="in" id="sP" value="${esc(s.place)}"></label><label class="f" for="sR">Курс: ₽ за 1 ฿<input class="in" type="number" step="0.01" id="sR" value="${esc(s.rate)}"></label></div>
 <label class="f" for="sB">Лимит трат на человека, ฿ (0 — без лимита)<input class="in" type="number" id="sB" value="${esc(s.budget||0)}"></label>
 <div class="row"><button class="btn" data-close>Отмена</button><button class="btn dark" id="sSave">Сохранить</button></div></div>${shareBox().replace('id="impF"','id="impF2"').replace('for="impF"','for="impF2"')}`,(sh,cl)=>{
 sh.querySelector('#sSave').onclick=async()=>{const st=sh.querySelector('#sS').value,en=sh.querySelector('#sE').value;if(!st||!en||en<st){toast('Проверьте даты');return}
  await saveST({names:[sh.querySelector('#sN0').value.trim()||'Я',sh.querySelector('#sN1').value.trim()||'Подруга'],start:st,end:en,place:sh.querySelector('#sP').value.trim()||'Таиланд',rate:+sh.querySelector('#sR').value||DEF.rate,budget:+sh.querySelector('#sB').value||0});cl();toast('Сохранено');go(VIEW,true)}})}

/* ================= router & render ================= */
const VIEWS={home:[vHome,mountHome],wardrobe:[vWardrobe,mountWardrobe],looks:[vLooks,mountLooks],plan:[vPlan,mountPlan],places:[vPlaces,mountPlaces],newyear:[vNY,mountNY],budget:[vBudget,mountBudget],diary:[vDiary,mountDiary],packing:[vPacking,mountPacking]};
function go(v,quiet){if(!VIEWS[v])v='home';const changed=v!==VIEW;VIEW=v;REDRAW=null;HOMEUPD=null;
 SKY.force=v==='newyear'?23.7:null;
 app.innerHTML=`<div class="view ${quiet?'':'enter'}">${VIEWS[v][0]()}</div>`;VIEWS[v][1]();moveInd();reveal();
 if(changed&&!quiet)window.scrollTo({top:0,behavior:RM?'auto':'smooth'})}

 const n=$('#nav');try{n.scrollTo({left:a.offsetLeft-n.clientWidth/2+a.offsetWidth/2,behavior:'smooth'})}catch(e){}}
function renderAll(full){
 if(document.querySelector('.modal'))return setTimeout(scheduleRender,400);
 if(!full&&REDRAW){REDRAW();return}
 go(VIEW,true);
}
document.addEventListener('click',e=>{if(e.target.closest('[data-export]'))exportPlan()});
document.addEventListener('change',e=>{if(e.target.id==='impF'||e.target.id==='impF2'){const f=e.target.files[0];e.target.value='';if(f){const m=document.querySelector('.modal');if(m)m.remove();importPlan(f)}}});
app.addEventListener('click',async e=>{const b=e.target.closest('[data-seed]');if(b){b.disabled=true;await fillSeed(b.dataset.seed)}});
addEventListener('hashchange',()=>go(location.hash.slice(1)));
addEventListener('resize',moveInd);

/* clocks */
function tick(){const now=Date.now();
 const c=$('#thclock');if(c)c.textContent=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Bangkok'});
 const t=$('#cdTrip');if(t){const ms=new Date(ST().start+'T00:00:00+03:00')-now;if(ms>0)cdSet(t,ms);else if(!t.dataset.done){t.dataset.done=1;t.innerHTML='<div class="cd" style="padding:10px 22px"><b style="font-size:28px">Мы в Таиланде!</b></div>'}}
 const n=$('#cdNY');if(n){const ms=Date.UTC(2026,11,31,17)-now;if(ms>0)cdSet(n,ms);else if(!n.dataset.done){n.dataset.done=1;n.innerHTML='<div class="cd" style="padding:10px 22px"><b style="font-size:30px">С Новым годом!</b></div>'}}
 const m=$('#cdMSK');if(m){const ms=Date.UTC(2026,11,31,21)-now;m.textContent=ms>0?`через ${Math.floor(ms/864e5)} д ${Math.floor(ms/36e5)%24} ч`:'уже наступил'}
 if(HOMEUPD&&SKY.override==null)HOMEUPD();
}
setInterval(tick,1000);

buildBotany();
go(location.hash.slice(1)||'home',true);
if(document.fonts)document.fonts.ready.then(moveInd);
initSky();initPetals();initData();
</script>
